name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK cannot use the network
        run: |
          merged_manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*merged*manifest*debug*' -print -quit)"
          if [ -z "$merged_manifest" ]; then
            echo "Debug merged manifest was not found"
            exit 1
          fi
          if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' "$merged_manifest"; then
            echo "Forbidden network permission found in $merged_manifest"
            grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)' "$merged_manifest"
            exit 1
          fi
          echo "Verified merged manifest has no network permissions"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk shotlist-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shotlist-apk
          path: shotlist-*.apk

      # Phone-friendly install path: a release per main build, newest marked latest.
      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Shotlist build ${{ github.run_number }}"
          make_latest: true
          files: shotlist-*.apk
